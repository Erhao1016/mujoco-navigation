version: '3'
services:
  mujoco_sim:
    build: ./simulation_docker
    container_name: mujoco_simulation
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=5
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - .:/workspace
    command: ["bash", "-c", "source /opt/ros/jazzy/setup.bash && python3 ros2_nodes/simulation_node.py"]
    networks:
      - ros_network
    ipc: host

  navigation:
    build: ./navigation_docker
    container_name: navigation_stack
    environment:
      - ROS_DOMAIN_ID=5
    volumes:
      - .:/workspace
    command: ["bash", "-c", "source /opt/ros/jazzy/setup.bash && python3 ros2_nodes/navigation_node.py"]
    depends_on:
      - mujoco_sim
    networks:
      - ros_network

networks:
  ros_network:
    driver: bridge
